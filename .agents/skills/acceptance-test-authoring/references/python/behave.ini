[behave]
# Formatters pair POSITIONALLY with outfiles. `html` must be listed FIRST so it
# claims reports/behave-report.html; `-` sends the progress formatter to stdout.
# Do NOT leave an outfiles line blank to mean stdout -- behave resolves the
# empty entry to '.' and dies with IsADirectoryError.
format    = html
            progress
outfiles  = reports/behave-report.html
            -

# Superseded rules are pruned out of .extracted/ before behave ever sees them
# (see openspec_effective_spec.py), so a green run has zero skipped scenarios.
# This only suppresses PRINTING of skipped steps; it does not change the counts.
show_skipped = false

# Undefined steps must fail the run -- the suite is the completion signal.
show_snippets = true

[behave.formatters]
html = behave_html_formatter:HTMLFormatter
# Prettier alternative, same mechanism -- pip install behave-html-pretty-formatter
# html = behave_html_pretty_formatter:PrettyHTMLFormatter
